<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>彰化縣英語國際村成果冊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #333;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: "Inter", "Microsoft JhengHei", sans-serif;
            color: #333;
            touch-action: none; 
        }

        .book-container {
            position: relative;
            width: 100%;
            height: calc(100% - 50px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        canvas {
            display: block;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: bold;
            color: #555;
            background: rgba(255,255,255,0.95);
            padding: 12px 24px;
            border-radius: 30px;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 20;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 24px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            outline: none;
        }
        @media (hover: hover) {
            .nav-btn:hover {
                background: rgba(255, 255, 255, 0.6);
                transform: translateY(-50%) scale(1.1);
            }
        }
        .nav-btn:disabled {
            opacity: 0;
            pointer-events: none;
        }
        .left-btn { left: 30px; }
        .right-btn { right: 30px; }

        /* --- 底部工具列 --- */
        .toolbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(30, 30, 30, 0.95);
            display: flex;
            align-items: center;
            padding: 0 20px 0 60px;
            box-sizing: border-box;
            z-index: 100;
            color: #ccc;
            gap: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .tool-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.2s;
            outline: none;
        }
        .tool-btn:hover, .tool-btn.active {
            color: #fff;
            transform: scale(1.1);
        }

        .page-info {
            font-size: 14px;
            white-space: nowrap;
            min-width: 65px;
            text-align: center;
            font-family: monospace;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .page-info:hover { background: rgba(255,255,255,0.2); color: #fff; }

        .slider-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #555;
            border-radius: 2px;
        }

        /* --- 分享彈出面板 --- */
        .share-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .share-popup {
            position: absolute;
            bottom: 45px;
            left: -100px;
            background: #4372b6; 
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: max-content;
            cursor: default;
        }

        .share-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .share-popup::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 105px;
            border-width: 10px 10px 0 10px;
            border-style: solid;
            border-color: #4372b6 transparent transparent transparent;
        }

        .share-top {
            display: flex;
            align-items: stretch;
            gap: 15px;
        }

        .qr-box {
            background: #fff;
            padding: 8px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .qr-box img {
            width: 100px;
            height: 100px;
            display: block;
        }
        .qr-box span {
            font-size: 11px;
            color: #999;
            font-weight: bold;
        }

        .share-divider {
            width: 1px;
            background: rgba(255,255,255,0.3);
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            align-content: center;
        }

        .social-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none; /* 如果改用 a 標籤時確保樣式 */
        }
        .social-btn:hover { transform: scale(1.1); }
        .bg-fb { background: #1877f2; }
        .bg-x { background: #000000; } /* X 新版黑色 */
        .bg-line { background: #00c300; } /* 換成台灣常用的 LINE */
        .bg-pin { background: #e60023; }
        .bg-in { background: #0a66c2; } /* LinkedIn */
        .bg-email { background: #c71610; }
        .bg-more { background: #ea4335; }

        .share-bottom input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            color: #555;
            outline: none;
        }

        /* --- 水平縮圖列 --- */
        .thumb-bar {
            position: absolute;
            bottom: 50px;
            left: 0;
            width: 100%;
            height: 120px;
            background: rgba(20, 20, 20, 0.9);
            z-index: 90;
            display: flex;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 10px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .thumb-bar.active {
            transform: translateY(0);
        }

        .thumb-bar::-webkit-scrollbar { height: 8px; }
        .thumb-bar::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .thumb-bar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }

        .thumb-item {
            height: 100%;
            aspect-ratio: 1 / 1.414;
            background: #fff;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .thumb-item:hover { transform: translateY(-2px); border-color: #888; }
        
        .thumb-item.current {
            border-color: #4CAF50;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
            z-index: 2;
        }

        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .thumb-page-num {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: #fff;
            text-align: center;
            font-size: 11px;
            padding: 2px 0;
        }

        @media (max-width: 768px) {
            .toolbar { padding: 0 10px 0 50px; gap: 8px; }
            .tool-btn { font-size: 16px; }
            .nav-btn { width: 40px; height: 40px; font-size: 20px; }
            .left-btn { left: 10px; }
            .right-btn { right: 10px; }
            .share-popup { left: -50px; }
            .share-popup::after { left: 55px; }
        }
    </style>
</head>
<body>

    <div class="book-container" id="book-wrap">
        <div id="loading">載入圖片中，請稍候...</div>
        <button id="prev-btn" class="nav-btn left-btn" disabled>❮</button>
        <button id="next-btn" class="nav-btn right-btn" disabled>❯</button>
        <canvas id="flipbook"></canvas>
    </div>

    <div class="thumb-bar" id="thumb-bar"></div>

    <div class="toolbar" id="toolbar" style="display: none;">
        <button class="tool-btn" id="btn-zoom-in" title="放大">➕</button>
        <button class="tool-btn" id="btn-zoom-out" title="縮小">➖</button>
        <button class="tool-btn" id="btn-grid" title="縮圖列">⊞</button>
        
        <div class="share-wrapper">
            <button class="tool-btn" id="btn-share" title="分享">🔗</button>
            <div class="share-popup" id="share-popup">
                <div class="share-top">
                    <div class="qr-box">
                        <img id="qr-img" src="" alt="QR Code">
                        <span>QR Code</span>
                    </div>
                    <div class="share-divider"></div>
                    <div class="social-grid">
                        <button class="social-btn bg-fb" id="share-fb" title="Facebook"><i class="fab fa-facebook-f"></i></button>
                        <button class="social-btn bg-x" id="share-x" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></button>
                        <button class="social-btn bg-line" id="share-line" title="LINE"><i class="fab fa-line"></i></button>
                        <button class="social-btn bg-in" id="share-in" title="LinkedIn"><i class="fab fa-linkedin-in"></i></button>
                        <button class="social-btn bg-pin" id="share-pin" title="Pinterest"><i class="fab fa-pinterest-p"></i></button>
                        <button class="social-btn bg-email" id="share-email" title="Email"><i class="fas fa-envelope"></i></button>
                        <button class="social-btn bg-more" id="share-more" title="更多分享選項" style="grid-column: span 3;"><i class="fas fa-share-nodes"></i></button>
                    </div>
                </div>
                <div class="share-bottom">
                    <input type="text" id="share-url-input" readonly title="點擊複製網址">
                </div>
            </div>
        </div>
        
        <div class="page-info" id="page-display" title="點擊輸入頁數">0 / 0</div>
        
        <div class="slider-container">
            <input type="range" id="page-slider" min="1" value="1" step="1">
        </div>
        
        <button class="tool-btn" id="btn-fullscreen" title="全螢幕">⛶</button>
    </div>

    <script>
        const canvas = document.getElementById('flipbook');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        const bookWrap = document.getElementById('book-wrap');
        
        const toolbar = document.getElementById('toolbar');
        const pageDisplay = document.getElementById('page-display');
        const pageSlider = document.getElementById('page-slider');
        const thumbBar = document.getElementById('thumb-bar');
        
        let canvasW, canvasH, paddingX, paddingY, bookW, bookH, pageW, pageH, spineX;
        let currentSpread = 0; 
        let isSinglePageMode = false; 
        let currentZoom = 1;

        let imageUrls = [];
        let maxIndex = 0;
        const images = [];
        let loadedCount = 0;
        let isImagesLoaded = false;

        const flip = {
            active: false, dragging: false, animating: false, dir: 1, 
            p: { x: 0, y: 0 }, target: { x: 0, y: 0 }, v: { x: 0, y: 0 },
            tension: 0.25, damping: 0.75
        };

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight - 50; 

            canvas.width = containerWidth * dpr;
            canvas.height = containerHeight * dpr;
            canvas.style.width = containerWidth + 'px';
            canvas.style.height = containerHeight + 'px';
            
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            canvasW = containerWidth;
            canvasH = containerHeight;

            isSinglePageMode = canvasH > canvasW * 1.05;

            let targetPageAspect = 1.414; 
            if (images.length > 0 && images[0] && images[0].width) {
                targetPageAspect = images[0].height / images[0].width;
            }

            let bookAspect;
            if (isSinglePageMode) {
                bookAspect = targetPageAspect;
                maxIndex = imageUrls.length - 1; 
            } else {
                bookAspect = targetPageAspect / 2;
                maxIndex = Math.ceil(imageUrls.length / 2) - 1;
            }

            const screenAspect = canvasH / canvasW;
            const marginRatio = isSinglePageMode ? 0.03 : 0.06; 

            if (screenAspect > bookAspect) {
                bookW = canvasW * (1 - marginRatio * 2);
                bookH = bookW * bookAspect;
            } else {
                bookH = canvasH * (1 - marginRatio * 2);
                bookW = bookH / bookAspect;
            }

            paddingX = (canvasW - bookW) / 2;
            paddingY = (canvasH - bookH) / 2;

            if (isSinglePageMode) {
                pageW = bookW;
                spineX = paddingX; 
            } else {
                pageW = bookW / 2;
                spineX = canvasW / 2; 
            }
            pageH = bookH;
            
            flip.active = false; flip.animating = false; flip.dragging = false;
            
            updateUI();
            if (isImagesLoaded) draw();
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);

        function checkAllImagesLoaded() {
            loadedCount++;
            if (loadedCount === imageUrls.length) {
                document.getElementById('loading').style.display = 'none';
                toolbar.style.display = 'flex';
                isImagesLoaded = true;
                pageSlider.max = imageUrls.length;
                
                generateThumbnails(); 
                resizeCanvas();
                requestAnimationFrame(renderLoop);
            }
        }

        async function fetchImagesFromSheet() {
            const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSpzQghjNZwK55tv9DZw6jVikZPkPdmHTkXDyXIz5pcg_Ao7B5KkTMKwFP4VRsRgFwj22yuXl3V8Ndm/pub?gid=0&single=true&output=csv'; 
            try {
                const response = await fetch(sheetCsvUrl);
                if (!response.ok) throw new Error('網路讀取失敗');
                const csvText = await response.text();
                const rows = csvText.split('\n').map(r => r.trim());
                imageUrls = rows.filter(row => row.startsWith('http')).map(url => url.replace('?authuser=0', ''));

                if(imageUrls.length > 0) startImageLoading();
                else document.getElementById('loading').innerText = '未找到圖片網址';
            } catch (error) {
                document.getElementById('loading').innerText = '讀取試算表失敗';
            }
        }

        function startImageLoading() {
            imageUrls.forEach((url, i) => {
                const img = new Image();
                img.onload = () => { images[i] = img; checkAllImagesLoaded(); };
                img.onerror = () => { images[i] = null; checkAllImagesLoaded(); };
                img.src = url;
            });
        }
        fetchImagesFromSheet();

        function constrainPoint(P, C) {
            let p = { x: P.x, y: P.y };
            let spineXPos = 0;
            if (isSinglePageMode && C.x === 0) spineXPos = pageW;

            let spineBase = { x: spineXPos, y: C.y };
            let dxSpine = p.x - spineBase.x;
            let dySpine = p.y - spineBase.y;
            let distSpine = Math.hypot(dxSpine, dySpine);
            if (distSpine > pageW) {
                p.x = spineBase.x + (dxSpine / distSpine) * pageW;
                p.y = spineBase.y + (dySpine / distSpine) * pageW;
            }

            let oppSpineBase = { x: spineXPos, y: (C.y === 0 ? pageH : 0) };
            let dxOpp = p.x - oppSpineBase.x;
            let dyOpp = p.y - oppSpineBase.y;
            let distOpp = Math.hypot(dxOpp, dyOpp);
            let diagonal = Math.hypot(pageW, pageH);
            if (distOpp > diagonal) {
                p.x = oppSpineBase.x + (dxOpp / distOpp) * diagonal;
                p.y = oppSpineBase.y + (dyOpp / distOpp) * diagonal;
            }
            
            if (p.x < -pageW * 2) p.x = -pageW * 2;
            if (p.x > pageW * 2) p.x = pageW * 2;

            return p;
        }

        function clipPolygon(points, M, n) {
            let result = [];
            for (let i = 0; i < points.length; i++) {
                let p1 = points[i]; let p2 = points[(i + 1) % points.length];
                let v1 = (p1.x - M.x) * n.x + (p1.y - M.y) * n.y;
                let v2 = (p2.x - M.x) * n.x + (p2.y - M.y) * n.y;
                if (v1 >= 0) result.push(p1);
                if (v1 * v2 < 0) {
                    let t = v1 / (v1 - v2);
                    result.push({ x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) });
                }
            }
            return result;
        }

        function tracePoly(ctx, pts) {
            if (!pts || pts.length === 0) return;
            ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
            for(let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();
        }

        function drawPageContent(ctx, idx) {
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, pageW, pageH);
            if (idx >= 0 && idx < imageUrls.length) {
                const img = images[idx];
                if (img && img.width) {
                    const margin = pageW * 0.005; 
                    const availW = pageW - margin * 2; const availH = pageH - margin * 2;
                    const imgAspect = img.width / img.height; const pageAspect = availW / availH;
                    let drawW, drawH;
                    if (imgAspect > pageAspect) { drawW = availW; drawH = availW / imgAspect; } 
                    else { drawH = availH; drawW = availH * imgAspect; }
                    
                    let offsetX = 0;
                    if (!isSinglePageMode) offsetX = (idx % 2 !== 0) ? -(pageW * 0.005) : (pageW * 0.005);
                    
                    let drawX = margin + (availW - drawW) / 2 + offsetX;
                    let drawY = margin + (availH - drawH) / 2;
                    ctx.drawImage(img, drawX, drawY, drawW, drawH);
                }
            }
            
            ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1; ctx.strokeRect(0, 0, pageW, pageH);
            
            if (!isSinglePageMode) {
                 if (idx % 2 !== 0) {
                     let spineShadow = ctx.createLinearGradient(pageW - 30, 0, pageW, 0);
                     spineShadow.addColorStop(0, 'rgba(0,0,0,0)'); spineShadow.addColorStop(1, 'rgba(0,0,0,0.18)');
                     ctx.fillStyle = spineShadow; ctx.fillRect(pageW - 30, 0, 30, pageH);
                 } else {
                     let spineShadow = ctx.createLinearGradient(0, 0, 30, 0);
                     spineShadow.addColorStop(0, 'rgba(0,0,0,0.18)'); spineShadow.addColorStop(1, 'rgba(0,0,0,0)');
                     ctx.fillStyle = spineShadow; ctx.fillRect(0, 0, 30, pageH);
                 }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvasW, canvasH);
            
            ctx.save(); ctx.translate(paddingX, paddingY);
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 30; ctx.shadowOffsetY = 15; ctx.fillRect(0, 0, bookW, bookH);
            ctx.restore();

            ctx.save(); ctx.translate(spineX, paddingY);
            let leftIdx = isSinglePageMode ? -1 : currentSpread * 2 - 1;
            let rightIdx = isSinglePageMode ? currentSpread : currentSpread * 2;

            if (!flip.active) {
                if (!isSinglePageMode && leftIdx >= 0) {
                    ctx.save(); ctx.translate(-pageW, 0); drawPageContent(ctx, leftIdx); ctx.restore();
                }
                if (rightIdx <= imageUrls.length) drawPageContent(ctx, rightIdx);
            } else {
                let bottomIdx, topIdx, peelCorner, isFlippingRight;
                let cornerY = flip.p.y < pageH / 2 ? 0 : pageH;

                if (flip.dir === 1) { 
                    isFlippingRight = true; topIdx = rightIdx;
                    bottomIdx = isSinglePageMode ? rightIdx + 1 : rightIdx + 2; 
                    peelCorner = { x: pageW, y: cornerY };
                } else { 
                    isFlippingRight = false;
                    if (isSinglePageMode) { topIdx = rightIdx - 1; bottomIdx = rightIdx; peelCorner = { x: 0, y: cornerY }; } 
                    else { topIdx = leftIdx; bottomIdx = leftIdx - 2; peelCorner = { x: -pageW, y: cornerY }; }
                }
                
                if (!isSinglePageMode) {
                    if (isFlippingRight) {
                        if (leftIdx >= 0) { ctx.save(); ctx.translate(-pageW, 0); drawPageContent(ctx, leftIdx); ctx.restore(); }
                    } else {
                        if (rightIdx < imageUrls.length) { drawPageContent(ctx, rightIdx); }
                    }
                }

                ctx.save();
                if (!isSinglePageMode && !isFlippingRight) ctx.translate(-pageW, 0);
                drawPageContent(ctx, bottomIdx); ctx.restore();

                let P = constrainPoint(flip.p, peelCorner);
                let dx = P.x - peelCorner.x, dy = P.y - peelCorner.y; let dist = Math.hypot(dx, dy);

                if (dist > 1) {
                    let M = { x: (peelCorner.x + P.x)/2, y: (peelCorner.y + P.y)/2 };
                    let n = { x: dx/dist, y: dy/dist };
                    let pageRect = isSinglePageMode ? [{x:0,y:0}, {x:pageW,y:0}, {x:pageW,y:pageH}, {x:0,y:pageH}] :
                        (isFlippingRight ? [{x:0,y:0}, {x:pageW,y:0}, {x:pageW,y:pageH}, {x:0,y:pageH}] :
                        [{x:-pageW,y:0}, {x:0,y:0}, {x:0,y:pageH}, {x:-pageW,y:pageH}]);

                    let polyUnfold = clipPolygon(pageRect, M, n); 
                    let polyFold = clipPolygon(pageRect, M, {x: -n.x, y: -n.y});

                    ctx.save(); tracePoly(ctx, polyUnfold); ctx.clip();
                    if (!isSinglePageMode && !isFlippingRight) ctx.translate(-pageW, 0);
                    drawPageContent(ctx, topIdx); ctx.restore();

                    ctx.save(); tracePoly(ctx, polyFold); ctx.clip();
                    let shadowGrad = ctx.createLinearGradient(M.x, M.y, M.x - n.x*120, M.y - n.y*120);
                    shadowGrad.addColorStop(0, 'rgba(0,0,0,0.6)');
                    shadowGrad.addColorStop(0.2, 'rgba(0,0,0,0.15)');
                    shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = shadowGrad; ctx.fillRect(isSinglePageMode || isFlippingRight ? 0 : -pageW, 0, pageW, pageH); ctx.restore();

                    ctx.save(); 
                    let t = { x: -n.y, y: n.x }; let alpha = Math.atan2(t.y, t.x);
                    ctx.translate(M.x, M.y); ctx.rotate(alpha); ctx.scale(1, -1); ctx.rotate(-alpha); ctx.translate(-M.x, -M.y);
                    
                    ctx.shadowColor = 'rgba(0,0,0,0.4)';
                    ctx.shadowBlur = 20;
                    ctx.shadowOffsetY = 5;
                    ctx.fillStyle = '#fff';
                    tracePoly(ctx, polyFold);
                    ctx.fill();

                    ctx.clip();
                    let backIdx = flip.dir === 1 ? topIdx + 1 : (isSinglePageMode ? topIdx : topIdx - 1);
                    ctx.save();
                    if (isSinglePageMode || isFlippingRight) { ctx.translate(pageW, 0); ctx.scale(-1, 1); } 
                    else { ctx.scale(-1, 1); }
                    drawPageContent(ctx, backIdx); ctx.restore();
                    
                    let foldGrad = ctx.createLinearGradient(M.x, M.y, M.x + n.x*100, M.y + n.y*100);
                    foldGrad.addColorStop(0, 'rgba(0,0,0,0.5)');        
                    foldGrad.addColorStop(0.08, 'rgba(255,255,255,0.7)'); 
                    foldGrad.addColorStop(0.3, 'rgba(255,255,255,0.1)'); 
                    foldGrad.addColorStop(1, 'rgba(0,0,0,0.15)');       
                    ctx.fillStyle = foldGrad; ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(polyFold[0].x, polyFold[0].y);
                    for(let i=1; i<polyFold.length; i++) ctx.lineTo(polyFold[i].x, polyFold[i].y);
                    ctx.closePath();
                    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.restore();
                } else {
                    if (!isSinglePageMode && !isFlippingRight) ctx.translate(-pageW, 0);
                    drawPageContent(ctx, topIdx);
                }
            }
            ctx.restore();
        }

        function renderLoop() {
            if (flip.animating) {
                const fx = -flip.tension * (flip.p.x - flip.target.x); const fy = -flip.tension * (flip.p.y - flip.target.y);
                flip.v.x += fx - flip.damping * flip.v.x; flip.v.y += fy - flip.damping * flip.v.y;
                flip.p.x += flip.v.x; flip.p.y += flip.v.y;

                if (Math.hypot(flip.p.x - flip.target.x, flip.p.y - flip.target.y) < 0.5 && Math.hypot(flip.v.x, flip.v.y) < 0.5) {
                    flip.animating = false; flip.p = { x: flip.target.x, y: flip.target.y }; flip.v = {x:0, y:0};
                    let isFlipped = false;
                    if (flip.dir === 1 && flip.target.x < (isSinglePageMode ? 0 : -pageW/2)) isFlipped = true;
                    if (flip.dir === -1 && flip.target.x > (isSinglePageMode ? pageW : pageW/2)) isFlipped = true;
                    if (isFlipped) currentSpread += flip.dir;
                    flip.active = false;
                    updateUI();
                }
            }
            if (isImagesLoaded) draw();
            requestAnimationFrame(renderLoop);
        }

        function getLocalPointer(e) {
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width; let scaleY = canvas.height / rect.height;
            let x = (clientX - rect.left) * scaleX - spineX; let y = (clientY - rect.top) * scaleY - paddingY;
            return { x, y };
        }

        let dragStart = { x:0, y:0 };
        function handlePointerDown(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.closest('.thumb-bar') || e.target.closest('.toolbar')) return;
            if (flip.animating) return;
            
            thumbBar.classList.remove('active'); 
            document.getElementById('btn-grid').classList.remove('active');
            document.getElementById('share-popup').classList.remove('active');

            let local = getLocalPointer(e); let corner;
            let isTop = local.y < pageH * 0.5;
            let cornerY = isTop ? 0 : pageH;

            let isNearCornerY = isTop ? (local.y < pageH * 0.3) : (local.y > pageH * 0.7);

            if (isNearCornerY) {
                if (isSinglePageMode) {
                    if (local.x > pageW * 0.7 && currentSpread < maxIndex) { corner = { x: pageW, y: cornerY }; flip.dir = 1; }
                    else if (local.x < pageW * 0.3 && currentSpread > 0) { corner = { x: 0, y: cornerY }; flip.dir = -1; }
                } else {
                    if (local.x > pageW * 0.5 && currentSpread < maxIndex) { corner = { x: pageW, y: cornerY }; flip.dir = 1; }
                    else if (local.x < -pageW * 0.5 && currentSpread > 0) { corner = { x: -pageW, y: cornerY }; flip.dir = -1; }
                }
            }

            if (corner) {
                flip.active = true; flip.dragging = true; flip.p = { x: corner.x, y: corner.y };
                flip.target = { x: corner.x - flip.dir * 30, y: corner.y + (isTop ? 20 : -20) };
                flip.animating = true; dragStart = local; canvas.style.cursor = 'grabbing'; e.preventDefault();
            }
        }
        
        function handlePointerMove(e) {
            let local = getLocalPointer(e);
            if (flip.dragging) { flip.p = local; flip.animating = false; e.preventDefault(); } 
            else {
                let isTop = local.y < pageH * 0.3;
                let isBottom = local.y > pageH * 0.7;
                let isHover = false;
                if (isTop || isBottom) {
                    if (isSinglePageMode) { if (local.x > pageW*0.7 || local.x < pageW*0.3) isHover = true; } 
                    else { if (local.x > pageW*0.5 || local.x < -pageW*0.5) isHover = true; }
                }
                canvas.style.cursor = isHover ? 'grab' : 'default';
            }
        }
        
        function handlePointerUp(e) {
            if (flip.dragging) {
                flip.dragging = false; flip.animating = true; canvas.style.cursor = 'grab';
                let dist = Math.hypot(flip.p.x - dragStart.x, flip.p.y - dragStart.y);
                if (dist < 20) setFlipTarget(flip.dir, true);
                else {
                    let titleOver = false;
                    if (flip.dir === 1 && flip.p.x < (isSinglePageMode ? pageW/4 : 0)) titleOver = true;
                    if (flip.dir === -1 && flip.p.x > (isSinglePageMode ? pageW*3/4 : 0)) titleOver = true;
                    setFlipTarget(flip.dir, titleOver);
                }
            }
        }
        
        function setFlipTarget(dir, isSuccess) {
             let finalX, finalY; 
             if (isSuccess) {
                 if (isSinglePageMode) finalX = dir === 1 ? -pageW * 0.8 : pageW * 1.8;
                 else finalX = dir === 1 ? -pageW * 1.5 : pageW * 1.5;
                 finalY = flip.p.y; 
             } else {
                 finalY = flip.p.y < pageH / 2 ? 0 : pageH; 
                 if (isSinglePageMode) finalX = dir === 1 ? pageW : 0;
                 else finalX = dir === 1 ? pageW : -pageW;
             }
             flip.target = { x: finalX, y: finalY };
        }

        canvas.addEventListener('mousedown', handlePointerDown); canvas.addEventListener('mousemove', handlePointerMove); window.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('touchstart', handlePointerDown, { passive: false }); canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp); window.addEventListener('touchcancel', handlePointerUp);

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateUI() {
            prevBtn.disabled = currentSpread === 0;
            nextBtn.disabled = currentSpread >= maxIndex;
            
            if (imageUrls.length > 0) {
                let displayStr = "";
                let actualPageBase = isSinglePageMode ? currentSpread + 1 : currentSpread * 2;
                
                if (isSinglePageMode) {
                    displayStr = `${actualPageBase} / ${imageUrls.length}`;
                } else {
                    if (actualPageBase === 0) displayStr = `1 / ${imageUrls.length}`;
                    else if (actualPageBase >= imageUrls.length) displayStr = `${imageUrls.length} / ${imageUrls.length}`;
                    else displayStr = `${actualPageBase}-${actualPageBase+1} / ${imageUrls.length}`;
                }
                pageDisplay.innerText = displayStr;

                let sliderVal = isSinglePageMode ? currentSpread + 1 : (currentSpread === 0 ? 1 : currentSpread * 2);
                pageSlider.value = sliderVal;

                document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('current'));
                let currentThumb = document.getElementById(`thumb-${sliderVal-1}`);
                if (currentThumb) {
                    currentThumb.classList.add('current');
                    if (thumbBar.classList.contains('active')) {
                        currentThumb.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
                    }
                }
            }
        }

        function triggerButtonFlip(dir) {
            thumbBar.classList.remove('active');
            document.getElementById('btn-grid').classList.remove('active');
            document.getElementById('share-popup').classList.remove('active');
            
            if (flip.animating || flip.dragging) return;
            let startX = isSinglePageMode ? (dir === 1 ? pageW : 0) : (dir === 1 ? pageW : -pageW);
            flip.active = true; flip.dragging = false; flip.animating = true; flip.dir = dir;
            flip.p = { x: startX, y: pageH }; flip.v = { x: 0, y: 0 }; setFlipTarget(dir, true);
        }
        nextBtn.addEventListener('click', () => triggerButtonFlip(1));
        prevBtn.addEventListener('click', () => triggerButtonFlip(-1));
        
        pageSlider.addEventListener('input', (e) => {
            let targetPage = parseInt(e.target.value);
            let targetSpread = isSinglePageMode ? targetPage - 1 : Math.floor(targetPage / 2);
            targetSpread = Math.min(Math.max(0, targetSpread), maxIndex);
            
            if (targetSpread !== currentSpread) {
                currentSpread = targetSpread;
                updateUI();
                if (isImagesLoaded) draw();
            }
        });

        function generateThumbnails() {
            thumbBar.innerHTML = '';
            imageUrls.forEach((url, index) => {
                const item = document.createElement('div');
                item.className = 'thumb-item';
                item.id = `thumb-${index}`;
                item.innerHTML = `
                    <img src="${url}" class="thumb-img" loading="lazy">
                    <div class="thumb-page-num">${index + 1}</div>
                `;
                item.addEventListener('click', () => {
                    let targetSpread = isSinglePageMode ? index : Math.floor((index + 1) / 2);
                    currentSpread = Math.min(Math.max(0, targetSpread), maxIndex);
                    updateUI();
                    if (isImagesLoaded) draw();
                });
                thumbBar.appendChild(item);
            });
        }
        
        document.getElementById('btn-grid').addEventListener('click', function(e) {
            e.stopPropagation();
            thumbBar.classList.toggle('active');
            this.classList.toggle('active');
            document.getElementById('share-popup').classList.remove('active');
            if (thumbBar.classList.contains('active')) updateUI();
        });

        // ★ 更新：動態綁定當前網址到社群分享按鈕
        const shareBtn = document.getElementById('btn-share');
        const sharePopup = document.getElementById('share-popup');
        const shareUrlInput = document.getElementById('share-url-input');
        const qrImg = document.getElementById('qr-img');

        shareBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            sharePopup.classList.toggle('active');
            thumbBar.classList.remove('active'); 
            document.getElementById('btn-grid').classList.remove('active');
            
            if (sharePopup.classList.contains('active')) {
                // 取得當前真實網址
                const currentUrl = window.location.href;
                const encodedUrl = encodeURIComponent(currentUrl);
                const shareText = encodeURIComponent("來看看這本線上翻頁書！");

                // 更新輸入框與 QR Code
                shareUrlInput.value = currentUrl;
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodedUrl}&margin=0`;
            }
        });

        // 社群按鈕實際分享行為
        const getUrl = () => encodeURIComponent(window.location.href);
        const getTitle = () => encodeURIComponent(document.title);

        document.getElementById('share-fb').addEventListener('click', () => {
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${getUrl()}`, '_blank', 'width=600,height=400');
        });
        document.getElementById('share-x').addEventListener('click', () => {
            window.open(`https://twitter.com/intent/tweet?url=${getUrl()}&text=${getTitle()}`, '_blank', 'width=600,height=400');
        });
        document.getElementById('share-line').addEventListener('click', () => {
            // LINE 分享 (台灣較普及)
            window.open(`https://social-plugins.line.me/lineit/share?url=${getUrl()}`, '_blank', 'width=600,height=500');
        });
        document.getElementById('share-in').addEventListener('click', () => {
            window.open(`https://www.linkedin.com/shareArticle?mini=true&url=${getUrl()}&title=${getTitle()}`, '_blank', 'width=600,height=500');
        });
        document.getElementById('share-pin').addEventListener('click', () => {
            // 取封面圖作為 Pinterest 預設圖
            let imgUrl = imageUrls.length > 0 ? encodeURIComponent(imageUrls[0]) : '';
            window.open(`https://pinterest.com/pin/create/button/?url=${getUrl()}&media=${imgUrl}&description=${getTitle()}`, '_blank', 'width=600,height=500');
        });
        document.getElementById('share-email').addEventListener('click', () => {
            window.location.href = `mailto:?subject=${getTitle()}&body=來看看這本翻頁書：${window.location.href}`;
        });
        document.getElementById('share-more').addEventListener('click', () => {
            // 呼叫系統內建的分享機制 (手機端有效)
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    text: '來看看這本線上翻頁書！',
                    url: window.location.href
                }).catch(err => console.log('分享取消或失敗', err));
            } else {
                alert("您的瀏覽器不支援原生分享選單，請使用上方其他按鈕或直接複製網址。");
            }
        });

        // 點擊網址框可自動複製
        shareUrlInput.addEventListener('click', function() {
            this.select();
            document.execCommand("copy");
            // 建立簡易提示
            let originalBg = this.style.backgroundColor;
            this.style.backgroundColor = "#e8f0fe";
            setTimeout(() => {
                this.style.backgroundColor = originalBg;
                alert("網址已複製！");
            }, 100);
        });

        // 防止點擊面板內容時關閉
        sharePopup.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // 點擊空白處關閉分享面板
        document.addEventListener('click', () => {
            sharePopup.classList.remove('active');
        });

        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            if(currentZoom < 2.5) currentZoom += 0.25;
            bookWrap.style.transform = `scale(${currentZoom})`;
        });
        
        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            if(currentZoom > 0.5) currentZoom -= 0.25;
            bookWrap.style.transform = `scale(${currentZoom})`;
        });

        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        pageDisplay.addEventListener('click', () => {
            let p = prompt(`輸入欲跳轉的頁數 (1 - ${imageUrls.length}):`);
            if (p) {
                let targetPage = parseInt(p);
                if (!isNaN(targetPage) && targetPage >= 1 && targetPage <= imageUrls.length) {
                    pageSlider.value = targetPage;
                    pageSlider.dispatchEvent(new Event('input'));
                }
            }
        });

    </script>
</body>
</html>
