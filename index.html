<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canvas 真實物理翻頁書 (整合預覽與工具列)</title>
    <style>
        body {
            background-color: #333; /* 配合工具列改為較深色的背景，突顯書本 */
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: "Inter", "Microsoft JhengHei", sans-serif;
            color: #333;
            touch-action: none; 
        }

        .book-container {
            position: relative;
            width: 100%;
            height: calc(100% - 50px); /* 預留底部工具列空間 */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        canvas {
            display: block;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4));
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: bold;
            color: #555;
            background: rgba(255,255,255,0.95);
            padding: 12px 24px;
            border-radius: 30px;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 20;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 24px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            outline: none;
        }
        @media (hover: hover) {
            .nav-btn:hover {
                background: rgba(255, 255, 255, 0.6);
                transform: translateY(-50%) scale(1.1);
            }
        }
        .nav-btn:disabled {
            opacity: 0;
            pointer-events: none;
        }
        .left-btn { left: 30px; }
        .right-btn { right: 30px; }

        /* --- 新增：底部工具列 (仿 File 1) --- */
        .toolbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(45, 45, 45, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 100;
            color: #ccc;
            gap: 15px;
        }

        .tool-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            outline: none;
        }
        .tool-btn:hover, .tool-btn.active {
            color: #fff;
        }

        .page-info {
            font-size: 14px;
            white-space: nowrap;
            min-width: 65px;
            text-align: center;
            font-family: monospace;
            cursor: pointer;
        }
        .page-info:hover { color: #fff; }

        .slider-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #666;
            border-radius: 2px;
        }

        /* --- 新增：全部頁面預覽 (網格) --- */
        .thumbnail-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 50px);
            background: rgba(30, 30, 30, 0.98);
            z-index: 90;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .thumbnail-overlay.active {
            display: flex;
            opacity: 1;
        }
        
        .thumb-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            background: rgba(0,0,0,0.5);
            font-size: 16px;
            font-weight: bold;
        }
        
        .close-thumb-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .thumb-grid-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .thumb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thumb-item {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }
        .thumb-item:hover {
            transform: translateY(-5px) scale(1.02);
        }
        .thumb-img {
            width: 100%;
            aspect-ratio: 1 / 1.414;
            background: #fff;
            object-fit: cover;
            border: 2px solid transparent;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .thumb-item.current .thumb-img {
            border-color: #4CAF50;
        }
        .thumb-label {
            color: #ccc;
            margin-top: 8px;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .toolbar { padding: 0 10px; gap: 8px; }
            .tool-btn { font-size: 16px; }
            .nav-btn { width: 40px; height: 40px; font-size: 20px; }
            .left-btn { left: 10px; }
            .right-btn { right: 10px; }
            .thumb-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }
    </style>
</head>
<body>

    <div class="book-container" id="book-wrap">
        <div id="loading">載入圖片中，請稍候...</div>
        <button id="prev-btn" class="nav-btn left-btn" disabled>❮</button>
        <button id="next-btn" class="nav-btn right-btn" disabled>❯</button>
        <canvas id="flipbook"></canvas>
    </div>

    <!-- 全部頁面預覽遮罩 -->
    <div class="thumbnail-overlay" id="thumb-overlay">
        <div class="thumb-header">
            <span>全部頁面預覽</span>
            <button class="close-thumb-btn" id="close-thumb-btn">✕</button>
        </div>
        <div class="thumb-grid-container">
            <div class="thumb-grid" id="thumb-grid">
                <!-- 縮圖將由 JS 動態生成 -->
            </div>
        </div>
    </div>

    <!-- 底部工具列 -->
    <div class="toolbar" id="toolbar" style="display: none;">
        <button class="tool-btn" id="btn-zoom-in" title="放大">➕</button>
        <button class="tool-btn" id="btn-zoom-out" title="縮小">➖</button>
        <button class="tool-btn" id="btn-grid" title="縮圖預覽">⊞</button>
        <button class="tool-btn" id="btn-sound" title="音效開啟/關閉">🔊</button>
        <button class="tool-btn" id="btn-share" title="分享">🔗</button>
        
        <div class="page-info" id="page-display" title="點擊輸入頁數">0 / 0</div>
        
        <div class="slider-container">
            <input type="range" id="page-slider" min="1" value="1" step="1">
        </div>
        
        <button class="tool-btn" id="btn-fullscreen" title="全螢幕">⛶</button>
    </div>

    <script>
        const canvas = document.getElementById('flipbook');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        const bookWrap = document.getElementById('book-wrap');
        
        // 工具列與預覽 DOM
        const toolbar = document.getElementById('toolbar');
        const pageDisplay = document.getElementById('page-display');
        const pageSlider = document.getElementById('page-slider');
        const thumbOverlay = document.getElementById('thumb-overlay');
        const thumbGrid = document.getElementById('thumb-grid');
        
        let canvasW, canvasH, paddingX, paddingY, bookW, bookH, pageW, pageH, spineX;
        let currentSpread = 0; 
        let isSinglePageMode = false; 
        let currentZoom = 1;

        let imageUrls = [];
        let maxIndex = 0;
        const images = [];
        let loadedCount = 0;
        let isImagesLoaded = false;
        let playSound = true;

        const flip = {
            active: false, dragging: false, animating: false, dir: 1, 
            p: { x: 0, y: 0 }, target: { x: 0, y: 0 }, v: { x: 0, y: 0 },
            tension: 0.25, damping: 0.75
        };

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            // 扣除底部工具列的高度 50px
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight - 50; 

            canvas.width = containerWidth * dpr;
            canvas.height = containerHeight * dpr;
            canvas.style.width = containerWidth + 'px';
            canvas.style.height = containerHeight + 'px';
            
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            canvasW = containerWidth;
            canvasH = containerHeight;

            isSinglePageMode = canvasH > canvasW * 1.05;

            let targetPageAspect = 1.414; 
            if (images.length > 0 && images[0] && images[0].width) {
                targetPageAspect = images[0].height / images[0].width;
            }

            let bookAspect;
            if (isSinglePageMode) {
                bookAspect = targetPageAspect;
                maxIndex = imageUrls.length - 1; 
            } else {
                bookAspect = targetPageAspect / 2;
                maxIndex = Math.ceil(imageUrls.length / 2) - 1;
            }

            const screenAspect = canvasH / canvasW;
            const marginRatio = isSinglePageMode ? 0.03 : 0.06; 

            if (screenAspect > bookAspect) {
                bookW = canvasW * (1 - marginRatio * 2);
                bookH = bookW * bookAspect;
            } else {
                bookH = canvasH * (1 - marginRatio * 2);
                bookW = bookH / bookAspect;
            }

            paddingX = (canvasW - bookW) / 2;
            paddingY = (canvasH - bookH) / 2;

            if (isSinglePageMode) {
                pageW = bookW;
                spineX = paddingX; 
            } else {
                pageW = bookW / 2;
                spineX = canvasW / 2; 
            }
            pageH = bookH;
            
            flip.active = false;
            flip.animating = false;
            flip.dragging = false;
            
            updateUI();
            if (isImagesLoaded) draw();
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);

        function checkAllImagesLoaded() {
            loadedCount++;
            if (loadedCount === imageUrls.length) {
                document.getElementById('loading').style.display = 'none';
                toolbar.style.display = 'flex'; // 顯示工具列
                isImagesLoaded = true;
                
                // 設定拉桿最大值
                pageSlider.max = imageUrls.length;
                
                generateThumbnails(); // 產生縮圖
                resizeCanvas();
                requestAnimationFrame(renderLoop);
            }
        }

        async function fetchImagesFromSheet() {
            const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSpzQghjNZwK55tv9DZw6jVikZPkPdmHTkXDyXIz5pcg_Ao7B5KkTMKwFP4VRsRgFwj22yuXl3V8Ndm/pub?gid=0&single=true&output=csv'; 
            try {
                const response = await fetch(sheetCsvUrl);
                if (!response.ok) throw new Error('網路讀取失敗');
                const csvText = await response.text();
                const rows = csvText.split('\n').map(r => r.trim());
                imageUrls = rows.filter(row => row.startsWith('http')).map(url => url.replace('?authuser=0', ''));

                if(imageUrls.length > 0) startImageLoading();
                else document.getElementById('loading').innerText = '未找到圖片網址';
            } catch (error) {
                document.getElementById('loading').innerText = '讀取試算表失敗';
            }
        }

        function startImageLoading() {
            imageUrls.forEach((url, i) => {
                const img = new Image();
                img.onload = () => { images[i] = img; checkAllImagesLoaded(); };
                img.onerror = () => { images[i] = null; checkAllImagesLoaded(); };
                img.src = url;
            });
        }
        fetchImagesFromSheet();

        function constrainPoint(P, C) {
            let p = { x: P.x, y: P.y };
            let dx = p.x - C.x; let dy = p.y - C.y;
            let dist = Math.hypot(dx, dy); let maxDist = Math.hypot(pageW, pageH);
            if (dist > maxDist) {
                p.x = C.x + (dx / dist) * maxDist; p.y = C.y + (dy / dist) * maxDist;
            }
            if (isSinglePageMode) { if (p.x < 0) p.x = 0; } 
            else { if (C.x > 0 && p.x < 0) p.x = 0; if (C.x < 0 && p.x > 0) p.x = 0; }
            return p;
        }

        function clipPolygon(points, M, n) {
            let result = [];
            for (let i = 0; i < points.length; i++) {
                let p1 = points[i]; let p2 = points[(i + 1) % points.length];
                let v1 = (p1.x - M.x) * n.x + (p1.y - M.y) * n.y;
                let v2 = (p2.x - M.x) * n.x + (p2.y - M.y) * n.y;
                if (v1 >= 0) result.push(p1);
                if (v1 * v2 < 0) {
                    let t = v1 / (v1 - v2);
                    result.push({ x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) });
                }
            }
            return result;
        }

        function tracePoly(ctx, pts) {
            if (!pts || pts.length === 0) return;
            ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
            for(let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();
        }

        function drawPageContent(ctx, idx) {
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, pageW, pageH);
            if (idx >= 0 && idx < imageUrls.length) {
                const img = images[idx];
                if (img && img.width) {
                    const margin = pageW * 0.005; 
                    const availW = pageW - margin * 2; const availH = pageH - margin * 2;
                    const imgAspect = img.width / img.height; const pageAspect = availW / availH;
                    let drawW, drawH;
                    if (imgAspect > pageAspect) { drawW = availW; drawH = availW / imgAspect; } 
                    else { drawH = availH; drawW = availH * imgAspect; }
                    
                    let offsetX = 0;
                    if (!isSinglePageMode) {
                        offsetX = (idx % 2 !== 0) ? -(pageW * 0.005) : (pageW * 0.005);
                    }
                    let drawX = margin + (availW - drawW) / 2 + offsetX;
                    let drawY = margin + (availH - drawH) / 2;
                    ctx.drawImage(img, drawX, drawY, drawW, drawH);
                }
            }
            ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 1; ctx.strokeRect(0, 0, pageW, pageH);
            
            if (!isSinglePageMode) {
                 if (idx % 2 !== 0) {
                     let spineShadow = ctx.createLinearGradient(pageW - 25, 0, pageW, 0);
                     spineShadow.addColorStop(0, 'rgba(0,0,0,0)'); spineShadow.addColorStop(1, 'rgba(0,0,0,0.12)');
                     ctx.fillStyle = spineShadow; ctx.fillRect(pageW - 25, 0, 25, pageH);
                 } else {
                     let spineShadow = ctx.createLinearGradient(0, 0, 25, 0);
                     spineShadow.addColorStop(0, 'rgba(0,0,0,0.12)'); spineShadow.addColorStop(1, 'rgba(0,0,0,0)');
                     ctx.fillStyle = spineShadow; ctx.fillRect(0, 0, 25, pageH);
                 }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvasW, canvasH);
            ctx.save(); ctx.translate(paddingX, paddingY);
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 25; ctx.shadowOffsetY = 10; ctx.fillRect(0, 0, bookW, bookH);
            ctx.restore();

            ctx.save(); ctx.translate(spineX, paddingY);
            let leftIdx = isSinglePageMode ? -1 : currentSpread * 2 - 1;
            let rightIdx = isSinglePageMode ? currentSpread : currentSpread * 2;

            if (!flip.active) {
                if (!isSinglePageMode && leftIdx >= 0) {
                    ctx.save(); ctx.translate(-pageW, 0); drawPageContent(ctx, leftIdx); ctx.restore();
                }
                if (rightIdx <= imageUrls.length) drawPageContent(ctx, rightIdx);
            } else {
                let bottomIdx, topIdx, peelCorner, isFlippingRight;
                if (flip.dir === 1) { 
                    isFlippingRight = true; topIdx = rightIdx;
                    bottomIdx = isSinglePageMode ? rightIdx + 1 : rightIdx + 2; peelCorner = { x: pageW, y: pageH };
                } else { 
                    isFlippingRight = false;
                    if (isSinglePageMode) { topIdx = rightIdx - 1; bottomIdx = rightIdx; peelCorner = { x: 0, y: pageH }; } 
                    else { topIdx = leftIdx; bottomIdx = leftIdx - 2; peelCorner = { x: -pageW, y: pageH }; }
                }
                
                ctx.save();
                if (!isSinglePageMode && !isFlippingRight) ctx.translate(-pageW, 0);
                drawPageContent(ctx, bottomIdx); ctx.restore();

                let P = constrainPoint(flip.p, peelCorner);
                let dx = P.x - peelCorner.x, dy = P.y - peelCorner.y; let dist = Math.hypot(dx, dy);

                if (dist > 1) {
                    let M = { x: (peelCorner.x + P.x)/2, y: (peelCorner.y + P.y)/2 };
                    let n = { x: dx/dist, y: dy/dist };
                    let pageRect = isSinglePageMode ? [{x:0,y:0}, {x:pageW,y:0}, {x:pageW,y:pageH}, {x:0,y:pageH}] :
                        (isFlippingRight ? [{x:0,y:0}, {x:pageW,y:0}, {x:pageW,y:pageH}, {x:0,y:pageH}] :
                        [{x:-pageW,y:0}, {x:0,y:0}, {x:0,y:pageH}, {x:-pageW,y:pageH}]);

                    let polyUnfold = clipPolygon(pageRect, M, n); let polyFold = clipPolygon(pageRect, M, {x: -n.x, y: -n.y});

                    ctx.save(); tracePoly(ctx, polyUnfold); ctx.clip();
                    if (!isSinglePageMode && !isFlippingRight) ctx.translate(-pageW, 0);
                    drawPageContent(ctx, topIdx); ctx.restore();

                    ctx.save(); tracePoly(ctx, polyFold); ctx.clip();
                    let shadowGrad = ctx.createLinearGradient(M.x, M.y, M.x - n.x*100, M.y - n.y*100);
                    shadowGrad.addColorStop(0, 'rgba(0,0,0,0.5)'); shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = shadowGrad; ctx.fillRect(isSinglePageMode || isFlippingRight ? 0 : -pageW, 0, pageW, pageH); ctx.restore();

                    ctx.save(); let t = { x: -n.y, y: n.x }; let alpha = Math.atan2(t.y, t.x);
                    ctx.translate(M.x, M.y); ctx.rotate(alpha); ctx.scale(1, -1); ctx.rotate(-alpha); ctx.translate(-M.x, -M.y);
                    tracePoly(ctx, polyFold); ctx.clip();
                    let backIdx = flip.dir === 1 ? topIdx + 1 : (isSinglePageMode ? topIdx : topIdx - 1);
                    ctx.save();
                    if (isSinglePageMode || isFlippingRight) { ctx.translate(pageW, 0); ctx.scale(-1, 1); } 
                    else { ctx.scale(-1, 1); }
                    drawPageContent(ctx, backIdx); ctx.restore();
                    
                    let foldGrad = ctx.createLinearGradient(M.x, M.y, M.x + n.x*50, M.y + n.y*50);
                    foldGrad.addColorStop(0, 'rgba(0,0,0,0.25)'); foldGrad.addColorStop(0.5, 'rgba(255,255,255,0.4)'); foldGrad.addColorStop(1, 'rgba(0,0,0,0.05)');
                    ctx.fillStyle = foldGrad; ctx.fill();
                    ctx.restore();
                } else {
                    if (!isSinglePageMode && !isFlippingRight) ctx.translate(-pageW, 0);
                    drawPageContent(ctx, topIdx);
                }
            }
            ctx.restore();
        }

        function renderLoop() {
            if (flip.animating) {
                const fx = -flip.tension * (flip.p.x - flip.target.x); const fy = -flip.tension * (flip.p.y - flip.target.y);
                flip.v.x += fx - flip.damping * flip.v.x; flip.v.y += fy - flip.damping * flip.v.y;
                flip.p.x += flip.v.x; flip.p.y += flip.v.y;

                if (Math.hypot(flip.p.x - flip.target.x, flip.p.y - flip.target.y) < 0.5 && Math.hypot(flip.v.x, flip.v.y) < 0.5) {
                    flip.animating = false; flip.p = { x: flip.target.x, y: flip.target.y }; flip.v = {x:0, y:0};
                    let isFlipped = false;
                    if (flip.dir === 1 && flip.target.x < (isSinglePageMode ? 0 : -pageW/2)) isFlipped = true;
                    if (flip.dir === -1 && flip.target.x > (isSinglePageMode ? pageW : pageW/2)) isFlipped = true;
                    if (isFlipped) currentSpread += flip.dir;
                    flip.active = false;
                    updateUI();
                }
            }
            if (isImagesLoaded) draw();
            requestAnimationFrame(renderLoop);
        }

        // 修改座標擷取以適應縮放
        function getLocalPointer(e) {
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // 處理 transform scale 的座標系
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;
            
            let x = (clientX - rect.left) * scaleX - spineX;
            let y = (clientY - rect.top) * scaleY - paddingY;
            return { x, y };
        }

        let dragStart = { x:0, y:0 };
        function handlePointerDown(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
            if (flip.animating) return;
            let local = getLocalPointer(e); let corner;
            if (isSinglePageMode) {
                if (local.y > pageH * 0.7) {
                    if (local.x > pageW * 0.7 && currentSpread < maxIndex) { corner = { x: pageW, y: pageH }; flip.dir = 1; }
                    else if (local.x < pageW * 0.3 && currentSpread > 0) { corner = { x: 0, y: pageH }; flip.dir = -1; }
                }
            } else {
                if (local.y > pageH * 0.7) {
                    if (local.x > pageW * 0.5 && currentSpread < maxIndex) { corner = { x: pageW, y: pageH }; flip.dir = 1; }
                    else if (local.x < -pageW * 0.5 && currentSpread > 0) { corner = { x: -pageW, y: pageH }; flip.dir = -1; }
                }
            }
            if (corner) {
                flip.active = true; flip.dragging = true; flip.p = { x: corner.x, y: corner.y };
                flip.target = { x: corner.x - flip.dir * 30, y: corner.y - 10 };
                flip.animating = true; dragStart = local; canvas.style.cursor = 'grabbing'; e.preventDefault();
            }
        }
        function handlePointerMove(e) {
            let local = getLocalPointer(e);
            if (flip.dragging) { flip.p = local; flip.animating = false; e.preventDefault(); } 
            else {
                let isHover = false;
                if (isSinglePageMode) { if (local.y > pageH*0.7 && (local.x > pageW*0.7 || local.x < pageW*0.3)) isHover = true; } 
                else { if (local.y > pageH*0.7 && (local.x > pageW*0.5 || local.x < -pageW*0.5)) isHover = true; }
                canvas.style.cursor = isHover ? 'grab' : 'default';
            }
        }
        function handlePointerUp(e) {
            if (flip.dragging) {
                flip.dragging = false; flip.animating = true; canvas.style.cursor = 'grab';
                let dist = Math.hypot(flip.p.x - dragStart.x, flip.p.y - dragStart.y);
                if (dist < 20) setFlipTarget(flip.dir, true);
                else {
                    let titleOver = false;
                    if (flip.dir === 1 && flip.p.x < (isSinglePageMode ? pageW/2 : 0)) titleOver = true;
                    if (flip.dir === -1 && flip.p.x > (isSinglePageMode ? pageW/2 : 0)) titleOver = true;
                    setFlipTarget(flip.dir, titleOver);
                }
            }
        }
        function setFlipTarget(dir, isSuccess) {
             let finalX, finalY = flip.p.y; 
             if (isSuccess) {
                 if (isSinglePageMode) finalX = dir === 1 ? -pageW * 0.8 : pageW * 1.8;
                 else finalX = dir === 1 ? -pageW * 1.5 : pageW * 1.5;
             } else {
                 finalY = pageH;
                 if (isSinglePageMode) finalX = dir === 1 ? pageW : 0;
                 else finalX = dir === 1 ? pageW : -pageW;
             }
             flip.target = { x: finalX, y: finalY };
        }

        canvas.addEventListener('mousedown', handlePointerDown); canvas.addEventListener('mousemove', handlePointerMove); window.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('touchstart', handlePointerDown, { passive: false }); canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp); window.addEventListener('touchcancel', handlePointerUp);

        // --- UI 更新與綁定 ---
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateUI() {
            // 左右按鈕
            prevBtn.disabled = currentSpread === 0;
            nextBtn.disabled = currentSpread >= maxIndex;
            
            if (imageUrls.length > 0) {
                // 更新頁碼文字 (如: "14-15 / 75")
                let displayStr = "";
                let actualPageBase = isSinglePageMode ? currentSpread + 1 : currentSpread * 2;
                
                if (isSinglePageMode) {
                    displayStr = `${actualPageBase} / ${imageUrls.length}`;
                } else {
                    if (actualPageBase === 0) displayStr = `1 / ${imageUrls.length}`;
                    else if (actualPageBase >= imageUrls.length) displayStr = `${imageUrls.length} / ${imageUrls.length}`;
                    else displayStr = `${actualPageBase}-${actualPageBase+1} / ${imageUrls.length}`;
                }
                pageDisplay.innerText = displayStr;

                // 更新拉桿數值 (對齊左頁或當前頁)
                let sliderVal = isSinglePageMode ? currentSpread + 1 : (currentSpread === 0 ? 1 : currentSpread * 2);
                pageSlider.value = sliderVal;

                // 標記縮圖網格的目前頁面
                document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('current'));
                let currentThumb = document.getElementById(`thumb-${sliderVal-1}`);
                if (currentThumb) {
                    currentThumb.classList.add('current');
                    // 自動滾動到該縮圖
                    if(thumbOverlay.classList.contains('active')) {
                        currentThumb.scrollIntoView({ behavior: "smooth", block: "center" });
                    }
                }
            }
        }

        function triggerButtonFlip(dir) {
            if (flip.animating || flip.dragging) return;
            let startX = isSinglePageMode ? (dir === 1 ? pageW : 0) : (dir === 1 ? pageW : -pageW);
            flip.active = true; flip.dragging = false; flip.animating = true; flip.dir = dir;
            flip.p = { x: startX, y: pageH }; flip.v = { x: 0, y: 0 }; setFlipTarget(dir, true);
        }
        nextBtn.addEventListener('click', () => triggerButtonFlip(1));
        prevBtn.addEventListener('click', () => triggerButtonFlip(-1));

        // --- 工具列事件 ---
        
        // 1. 滑桿拖動跳頁
        pageSlider.addEventListener('input', (e) => {
            let targetPage = parseInt(e.target.value);
            let targetSpread = isSinglePageMode ? targetPage - 1 : Math.floor(targetPage / 2);
            targetSpread = Math.min(Math.max(0, targetSpread), maxIndex);
            
            if (targetSpread !== currentSpread) {
                currentSpread = targetSpread;
                updateUI();
                if (isImagesLoaded) draw();
            }
        });

        // 2. 縮圖預覽功能
        function generateThumbnails() {
            thumbGrid.innerHTML = '';
            imageUrls.forEach((url, index) => {
                const item = document.createElement('div');
                item.className = 'thumb-item';
                item.id = `thumb-${index}`;
                item.innerHTML = `
                    <img src="${url}" class="thumb-img" loading="lazy">
                    <div class="thumb-label">第 ${index + 1} 頁</div>
                `;
                item.addEventListener('click', () => {
                    let targetSpread = isSinglePageMode ? index : Math.floor((index + 1) / 2);
                    currentSpread = Math.min(Math.max(0, targetSpread), maxIndex);
                    thumbOverlay.classList.remove('active');
                    updateUI();
                    if (isImagesLoaded) draw();
                });
                thumbGrid.appendChild(item);
            });
        }
        
        document.getElementById('btn-grid').addEventListener('click', () => {
            thumbOverlay.classList.add('active');
            updateUI(); // 觸發滾動到目前頁面
        });
        document.getElementById('close-thumb-btn').addEventListener('click', () => {
            thumbOverlay.classList.remove('active');
        });

        // 3. 畫面縮放功能
        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            if(currentZoom < 2.5) currentZoom += 0.25;
            bookWrap.style.transform = `scale(${currentZoom})`;
        });
        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            if(currentZoom > 0.5) currentZoom -= 0.25;
            bookWrap.style.transform = `scale(${currentZoom})`;
        });

        // 4. 全螢幕功能
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // 5. 點擊文字輸入跳頁
        pageDisplay.addEventListener('click', () => {
            let p = prompt(`輸入欲跳轉的頁數 (1 - ${imageUrls.length}):`);
            if (p) {
                let targetPage = parseInt(p);
                if (!isNaN(targetPage) && targetPage >= 1 && targetPage <= imageUrls.length) {
                    pageSlider.value = targetPage;
                    pageSlider.dispatchEvent(new Event('input'));
                }
            }
        });

        // 音效與分享 (視覺佔位，可後續擴充)
        document.getElementById('btn-sound').addEventListener('click', function() {
            playSound = !playSound;
            this.innerText = playSound ? '🔊' : '🔇';
            this.classList.toggle('active', !playSound);
        });
        document.getElementById('btn-share').addEventListener('click', () => {
            alert('您可以在此處串接分享連結或 Navigator.share API');
        });

    </script>
</body>
</html>
