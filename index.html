<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>彰化縣英語國際村成果電子書</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #262626; margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; 
            font-family: "Inter", "Microsoft JhengHei", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none;
        }
        .book-container { position: relative; width: 100%; height: calc(100% - 50px); display: flex; align-items: center; justify-content: center; }
        canvas { display: block; filter: drop-shadow(0 25px 45px rgba(0,0,0,0.6)); cursor: default; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 16px; font-weight: bold; color: #555; background: rgba(255,255,255,0.95); padding: 12px 24px; border-radius: 30px; pointer-events: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 20; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.3); font-size: 24px; color: white; cursor: pointer; transition: all 0.3s; z-index: 10; display: flex; align-items: center; justify-content: center; outline: none; }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.85); color: #333; }
        .nav-btn:disabled { opacity: 0; pointer-events: none; }
        .left-btn { left: 30px; } .right-btn { right: 30px; }
        /* 修改：將原本的 padding: 0 20px 0 60px 改為 padding: 0 15px */
.toolbar { position: absolute; bottom: 0; left: 0; width: 100%; height: 50px; background: rgba(25, 25, 25, 0.95); display: flex; align-items: center; padding: 0 70px; /* ★ 修改這裡：加大左右內距 */ box-sizing: border-box; z-index: 100; color: #ccc; gap: 15px; border-top: 1px solid rgba(255,255,255,0.05); }

/* 新增：工具列按鈕的禁用狀態 (防止首頁點擊上一頁) */
.tool-btn:disabled { opacity: 0.3; pointer-events: none; }
        .tool-btn { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; padding: 5px; transition: color 0.2s, transform 0.2s; outline: none; border-radius: 4px; }
        .tool-btn:hover, .tool-btn.active { color: #fff; transform: scale(1.1); }
        .page-info { font-size: 14px; white-space: nowrap; min-width: 65px; text-align: center; font-family: monospace; cursor: pointer; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; transition: background 0.2s; }
        .page-info:hover { background: rgba(255,255,255,0.2); color: #fff; }
        .slider-container { flex-grow: 1; display: flex; align-items: center; padding: 0 10px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #fff; cursor: pointer; margin-top: -6px; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #555; border-radius: 2px; }
        .share-wrapper { position: relative; display: flex; align-items: center; }
        .share-popup { position: absolute; bottom: 50px; left: -100px; background: #365e9d; padding: 15px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px; opacity: 0; visibility: hidden; transform: translateY(10px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); width: max-content; }
        .share-popup.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .share-popup::after { content: ''; position: absolute; bottom: -8px; left: 105px; border-width: 8px 8px 0 8px; border-style: solid; border-color: #365e9d transparent transparent transparent; }
        .share-top { display: flex; gap: 15px; }
        .qr-box { background: #fff; padding: 8px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .qr-box img { width: 100px; height: 100px; }
        .qr-box span { font-size: 11px; color: #888; font-weight: bold; }
        .share-divider { width: 1px; background: rgba(255,255,255,0.25); }
        .social-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: center; }
        .social-btn { width: 32px; height: 32px; border-radius: 50%; border: none; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; transition: transform 0.2s; }
        .social-btn:hover { transform: scale(1.1); }
        .bg-fb { background: #1877f2; } .bg-x { background: #000000; } .bg-line { background: #00c300; } .bg-in { background: #0a66c2; } .bg-pin { background: #e60023; } .bg-email { background: #c71610; } .bg-more { background: #ea4335; }
        .share-bottom input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: none; border-radius: 4px; font-size: 12px; outline: none; cursor: pointer; background: #fff; }
        .thumb-bar { position: absolute; bottom: 50px; left: 0; width: 100%; height: 120px; background: rgba(20, 20, 20, 0.94); z-index: 90; display: flex; align-items: center; padding: 10px 15px; box-sizing: border-box; overflow-x: auto; gap: 12px; transform: translateY(100%); transition: transform 0.3s; border-top: 1px solid rgba(255,255,255,0.1); }
        .thumb-bar.active { transform: translateY(0); }
        .thumb-bar::-webkit-scrollbar { height: 6px; } .thumb-bar::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); } .thumb-bar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }
        .thumb-item { height: 100%; aspect-ratio: 1 / 1.414; background: #222; flex-shrink: 0; cursor: pointer; position: relative; border: 2px solid transparent; transition: transform 0.2s, border-color 0.2s; border-radius: 3px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .thumb-item:hover { transform: translateY(-2px); border-color: #888; }
        .thumb-item.current { border-color: #4CAF50; transform: scale(1.05); box-shadow: 0 0 10px rgba(76, 175, 80, 0.5); z-index: 2; }
        .thumb-img-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #777; background: #fff; }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-page-num { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.7); color: #fff; text-align: center; font-size: 11px; padding: 2px 0; font-family: monospace; }
        @media (max-width: 768px) { .toolbar { padding: 0 10px; gap: 8px; } .nav-btn { width: 42px; height: 42px; font-size: 20px; } .left-btn { left: 10px; } .right-btn { right: 10px; } .share-popup { left: -50px; } .share-popup::after { left: 55px; } }
		.toast-msg {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 15px;
            letter-spacing: 1px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 200;
        }
        .toast-msg.show { opacity: 1; }
	</style>
</head>
<body>

    <div class="book-container" id="book-wrap">
        <div id="loading"><i class="fas fa-spinner fa-spin"></i> 初始化系統中...</div>
        <button id="prev-btn" class="nav-btn left-btn" disabled title="上一頁 (←)">❮</button>
        <button id="next-btn" class="nav-btn right-btn" disabled title="下一頁 (→)">❯</button>
        <canvas id="flipbook"></canvas>
		<!-- 新增以下這行 -->
        <div id="toast-msg" class="toast-msg">這是最後一頁</div>
    </div>

    <div class="thumb-bar" id="thumb-bar"></div>

    <div class="toolbar" id="toolbar" style="display: none;">
        <!-- 新增：跳到第一頁 (置於最左側) -->
    <button class="tool-btn" id="btn-first" title="第一頁"><i class="fas fa-backward-step"></i></button>
    
    <button class="tool-btn" id="btn-zoom-in" title="放大">➕</button>
    <button class="tool-btn" id="btn-zoom-out" title="縮小">➖</button>
        <button class="tool-btn" id="btn-grid" title="縮圖目錄">⊞</button>
        <div class="share-wrapper">
            <button class="tool-btn" id="btn-share" title="分享">🔗</button>
            <div class="share-popup" id="share-popup">
                <div class="share-top">
                    <div class="qr-box"><img id="qr-img" src="" alt="QR"><span>掃描開啟</span></div>
                    <div class="share-divider"></div>
                    <div class="social-grid">
                        <button class="social-btn bg-fb" id="share-fb" title="Facebook"><i class="fab fa-facebook-f"></i></button>
                        <button class="social-btn bg-x" id="share-x" title="X"><i class="fa-brands fa-x-twitter"></i></button>
                        <button class="social-btn bg-line" id="share-line" title="LINE"><i class="fab fa-line"></i></button>
                        <button class="social-btn bg-in" id="share-in" title="LinkedIn"><i class="fab fa-linkedin-in"></i></button>
                        <button class="social-btn bg-pin" id="share-pin" title="Pinterest"><i class="fab fa-pinterest-p"></i></button>
                        <button class="social-btn bg-email" id="share-email" title="Email"><i class="fas fa-envelope"></i></button>
                        <button class="social-btn bg-more" id="share-more" title="更多分享選項" style="grid-column: span 3;"><i class="fas fa-share-nodes"></i></button>
                    </div>
                </div>
                <div class="share-bottom"><input type="text" id="share-url-input" readonly title="點擊直接複製網址"></div>
            </div>
        </div>
        <div class="page-info" id="page-display" title="點擊輸入頁碼跳頁">0 / 0</div>
        <div class="slider-container"><input type="range" id="page-slider" min="1" value="1" step="1"></div>
        <button class="tool-btn" id="btn-fullscreen" title="全螢幕切換">⛶</button>
    <!-- 新增：跳到最後一頁 (置於最右側) -->
    <button class="tool-btn" id="btn-last" title="最後一頁"><i class="fas fa-forward-step"></i></button>
</div>
