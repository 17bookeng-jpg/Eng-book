<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>彰化縣英語國際村成果電子書</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #262626; margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; 
            font-family: "Inter", "Microsoft JhengHei", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none;
        }
        .book-container { position: relative; width: 100%; height: calc(100% - 50px); display: flex; align-items: center; justify-content: center; }
        canvas { display: block; filter: drop-shadow(0 25px 45px rgba(0,0,0,0.6)); cursor: default; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 16px; font-weight: bold; color: #555; background: rgba(255,255,255,0.95); padding: 12px 24px; border-radius: 30px; pointer-events: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 20; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.3); font-size: 24px; color: white; cursor: pointer; transition: all 0.3s; z-index: 10; display: flex; align-items: center; justify-content: center; outline: none; }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.85); color: #333; }
        .nav-btn:disabled { opacity: 0; pointer-events: none; }
        .left-btn { left: 30px; } .right-btn { right: 30px; }
        /* 修改：將原本的 padding: 0 20px 0 60px 改為 padding: 0 15px */
.toolbar { position: absolute; bottom: 0; left: 0; width: 100%; height: 50px; background: rgba(25, 25, 25, 0.95); display: flex; align-items: center; padding: 0 70px; /* ★ 修改這裡：加大左右內距 */ box-sizing: border-box; z-index: 100; color: #ccc; gap: 15px; border-top: 1px solid rgba(255,255,255,0.05); }

/* 新增：工具列按鈕的禁用狀態 (防止首頁點擊上一頁) */
.tool-btn:disabled { opacity: 0.3; pointer-events: none; }
        .tool-btn { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; padding: 5px; transition: color 0.2s, transform 0.2s; outline: none; border-radius: 4px; }
        .tool-btn:hover, .tool-btn.active { color: #fff; transform: scale(1.1); }
        .page-info { font-size: 14px; white-space: nowrap; min-width: 65px; text-align: center; font-family: monospace; cursor: pointer; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; transition: background 0.2s; }
        .page-info:hover { background: rgba(255,255,255,0.2); color: #fff; }
        .slider-container { flex-grow: 1; display: flex; align-items: center; padding: 0 10px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #fff; cursor: pointer; margin-top: -6px; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #555; border-radius: 2px; }
        .share-wrapper { position: relative; display: flex; align-items: center; }
        .share-popup { position: absolute; bottom: 50px; left: -100px; background: #365e9d; padding: 15px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px; opacity: 0; visibility: hidden; transform: translateY(10px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); width: max-content; }
        .share-popup.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .share-popup::after { content: ''; position: absolute; bottom: -8px; left: 105px; border-width: 8px 8px 0 8px; border-style: solid; border-color: #365e9d transparent transparent transparent; }
        .share-top { display: flex; gap: 15px; }
        .qr-box { background: #fff; padding: 8px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .qr-box img { width: 100px; height: 100px; }
        .qr-box span { font-size: 11px; color: #888; font-weight: bold; }
        .share-divider { width: 1px; background: rgba(255,255,255,0.25); }
        .social-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: center; }
        .social-btn { width: 32px; height: 32px; border-radius: 50%; border: none; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; transition: transform 0.2s; }
        .social-btn:hover { transform: scale(1.1); }
        .bg-fb { background: #1877f2; } .bg-x { background: #000000; } .bg-line { background: #00c300; } .bg-in { background: #0a66c2; } .bg-pin { background: #e60023; } .bg-email { background: #c71610; } .bg-more { background: #ea4335; }
        .share-bottom input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: none; border-radius: 4px; font-size: 12px; outline: none; cursor: pointer; background: #fff; }
        .thumb-bar { position: absolute; bottom: 50px; left: 0; width: 100%; height: 120px; background: rgba(20, 20, 20, 0.94); z-index: 90; display: flex; align-items: center; padding: 10px 15px; box-sizing: border-box; overflow-x: auto; gap: 12px; transform: translateY(100%); transition: transform 0.3s; border-top: 1px solid rgba(255,255,255,0.1); }
        .thumb-bar.active { transform: translateY(0); }
        .thumb-bar::-webkit-scrollbar { height: 6px; } .thumb-bar::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); } .thumb-bar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }
        .thumb-item { height: 100%; aspect-ratio: 1 / 1.414; background: #222; flex-shrink: 0; cursor: pointer; position: relative; border: 2px solid transparent; transition: transform 0.2s, border-color 0.2s; border-radius: 3px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .thumb-item:hover { transform: translateY(-2px); border-color: #888; }
        .thumb-item.current { border-color: #4CAF50; transform: scale(1.05); box-shadow: 0 0 10px rgba(76, 175, 80, 0.5); z-index: 2; }
        .thumb-img-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #777; background: #fff; }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-page-num { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.7); color: #fff; text-align: center; font-size: 11px; padding: 2px 0; font-family: monospace; }
        @media (max-width: 768px) { .toolbar { padding: 0 10px; gap: 8px; } .nav-btn { width: 42px; height: 42px; font-size: 20px; } .left-btn { left: 10px; } .right-btn { right: 10px; } .share-popup { left: -50px; } .share-popup::after { left: 55px; } }
		.toast-msg {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 15px;
            letter-spacing: 1px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 200;
        }
        .toast-msg.show { opacity: 1; }
	</style>
</head>
<body>

    <div class="book-container" id="book-wrap">
        <div id="loading"><i class="fas fa-spinner fa-spin"></i> 初始化系統中...</div>
        <button id="prev-btn" class="nav-btn left-btn" disabled title="上一頁 (←)">❮</button>
        <button id="next-btn" class="nav-btn right-btn" disabled title="下一頁 (→)">❯</button>
        <canvas id="flipbook"></canvas>
		<!-- 新增以下這行 -->
        <div id="toast-msg" class="toast-msg">這是最後一頁</div>
    </div>

    <div class="thumb-bar" id="thumb-bar"></div>

    <div class="toolbar" id="toolbar" style="display: none;">
        <!-- 新增：跳到第一頁 (置於最左側) -->
    <button class="tool-btn" id="btn-first" title="第一頁"><i class="fas fa-backward-step"></i></button>
    
    <button class="tool-btn" id="btn-zoom-in" title="放大">➕</button>
    <button class="tool-btn" id="btn-zoom-out" title="縮小">➖</button>
        <button class="tool-btn" id="btn-grid" title="縮圖目錄">⊞</button>
        <div class="share-wrapper">
            <button class="tool-btn" id="btn-share" title="分享">🔗</button>
            <div class="share-popup" id="share-popup">
                <div class="share-top">
                    <div class="qr-box"><img id="qr-img" src="" alt="QR"><span>掃描開啟</span></div>
                    <div class="share-divider"></div>
                    <div class="social-grid">
                        <button class="social-btn bg-fb" id="share-fb" title="Facebook"><i class="fab fa-facebook-f"></i></button>
                        <button class="social-btn bg-x" id="share-x" title="X"><i class="fa-brands fa-x-twitter"></i></button>
                        <button class="social-btn bg-line" id="share-line" title="LINE"><i class="fab fa-line"></i></button>
                        <button class="social-btn bg-in" id="share-in" title="LinkedIn"><i class="fab fa-linkedin-in"></i></button>
                        <button class="social-btn bg-pin" id="share-pin" title="Pinterest"><i class="fab fa-pinterest-p"></i></button>
                        <button class="social-btn bg-email" id="share-email" title="Email"><i class="fas fa-envelope"></i></button>
                        <button class="social-btn bg-more" id="share-more" title="更多分享選項" style="grid-column: span 3;"><i class="fas fa-share-nodes"></i></button>
                    </div>
                </div>
                <div class="share-bottom"><input type="text" id="share-url-input" readonly title="點擊直接複製網址"></div>
            </div>
        </div>
        <div class="page-info" id="page-display" title="點擊輸入頁碼跳頁">0 / 0</div>
        <div class="slider-container"><input type="range" id="page-slider" min="1" value="1" step="1"></div>
        <button class="tool-btn" id="btn-fullscreen" title="全螢幕切換">⛶</button>
    <!-- 新增：跳到最後一頁 (置於最右側) -->
    <button class="tool-btn" id="btn-last" title="最後一頁"><i class="fas fa-forward-step"></i></button>
</div>

    <script>
        const canvas = document.getElementById('flipbook');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        const toolbar = document.getElementById('toolbar');
        const pageDisplay = document.getElementById('page-display');
        const pageSlider = document.getElementById('page-slider');
        const thumbBar = document.getElementById('thumb-bar');
        
        let canvasW, canvasH, paddingX, paddingY, bookW, bookH, pageW, pageH, spineX;
        let currentSpread = 0; let isSinglePageMode = false; 
        let currentZoom = 1; let panX = 0; let panY = 0;
        let isPanning = false; let panStart = { x: 0, y: 0 }; let dragStart = { x: 0, y: 0 };
        let swipeStartGlobal = { x: 0, y: 0, time: 0 }; let touchStartDist = 0; let zoomStartVal = 1;

        let imageUrls = []; let maxIndex = 0; let images = []; let imageLoadStatus = []; 
        let initialLoaded = false; let idleLoadTimer = null;

        const flip = {
            active: false, dragging: false, animating: false, 
            hovering: false, isRetracting: false,
            dir: 1, p: { x: 0, y: 0 }, target: { x: 0, y: 0 }, v: { x: 0, y: 0 },
            tension: 0.35, damping: 0.7, cornerBase: { x: 0, y: 0 }
        };

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight - 50; 
            canvas.width = containerWidth * dpr; canvas.height = containerHeight * dpr;
            canvas.style.width = containerWidth + 'px'; canvas.style.height = containerHeight + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr);
            canvasW = containerWidth; canvasH = containerHeight;

            isSinglePageMode = canvasH > canvasW * 1.05;
            let targetPageAspect = 1.414; 
            let referenceImg = images.find(img => img && img.width);
            if (referenceImg) targetPageAspect = referenceImg.height / referenceImg.width;

            let bookAspect = isSinglePageMode ? targetPageAspect : targetPageAspect / 2;
            maxIndex = isSinglePageMode ? Math.max(0, imageUrls.length - 1) : Math.max(0, Math.ceil(imageUrls.length / 2) - 1);
			const marginRatio = 0.005; // 將留白縮小至 0.5%，讓畫面極大化
            //const marginRatio = isSinglePageMode ? 0.02 : 0.04; 
            if (canvasH / canvasW > bookAspect) {
                bookW = canvasW * (1 - marginRatio * 2); bookH = bookW * bookAspect;
            } else {
                bookH = canvasH * (1 - marginRatio * 2); bookW = bookH / bookAspect;
            }

            paddingX = (canvasW - bookW) / 2; paddingY = (canvasH - bookH) / 2;
            if (isSinglePageMode) { pageW = bookW; spineX = paddingX; } else { pageW = bookW / 2; spineX = canvasW / 2; }
            pageH = bookH;
            
            flip.active = false; flip.animating = false; flip.dragging = false; 
            flip.hovering = false; flip.isRetracting = false;
            
            if (initialLoaded) { updateUI(); draw(); }
        }

        window.addEventListener('resize', resizeCanvas); window.addEventListener('orientationchange', resizeCanvas);

        async function fetchImagesFromSheet() {
            const sheetCsvUrl = `https://docs.google.com/spreadsheets/d/e/2PACX-1vSpzQghjNZwK55tv9DZw6jVikZPkPdmHTkXDyXIz5pcg_Ao7B5KkTMKwFP4VRsRgFwj22yuXl3V8Ndm/pub?gid=0&single=true&output=csv&_t=${Date.now()}`; 
            try {
                const response = await fetch(sheetCsvUrl);
                if (!response.ok) throw new Error('網路讀取失敗');
                imageUrls = (await response.text()).split(/\r?\n/).map(r => r.trim()).filter(row => row.startsWith('http')).map(url => url.replace('?authuser=0', ''));
                if (imageUrls.length > 0) initImageLoader();
                else document.getElementById('loading').innerText = '未找到有效圖片網址';
            } catch (e) { document.getElementById('loading').innerText = '電子書資料讀取失敗，請確認網路連線'; }
        }

        function initImageLoader() {
            images = new Array(imageUrls.length).fill(null); imageLoadStatus = new Array(imageUrls.length).fill(0);
            pageSlider.max = imageUrls.length; loadPriorityImages();
            idleLoadTimer = setInterval(() => { let idx = imageLoadStatus.indexOf(0); if (idx !== -1) loadImage(idx); else clearInterval(idleLoadTimer); }, 300);
        }

        function loadPriorityImages() {
            let baseIdx = isSinglePageMode ? currentSpread : currentSpread * 2; let toLoad = [];
            for (let i = baseIdx - 2; i <= baseIdx + 3; i++) { if (i >= 0 && i < imageUrls.length && imageLoadStatus[i] === 0) toLoad.push(i); }
            [0, 1, imageUrls.length - 2, imageUrls.length - 1].forEach(i => { if (i >= 0 && i < imageUrls.length && imageLoadStatus[i] === 0) toLoad.push(i); });
            toLoad.forEach(i => loadImage(i));
        }

        function loadImage(idx) {
            if (imageLoadStatus[idx] !== 0) return;
            imageLoadStatus[idx] = 1; const img = new Image();
            img.onload = () => { images[idx] = img; imageLoadStatus[idx] = 2; checkInitialLoad(); updateThumbnail(idx); };
            img.onerror = () => { images[idx] = null; imageLoadStatus[idx] = -1; checkInitialLoad(); updateThumbnail(idx); };
            img.src = imageUrls[idx];
        }

        function checkInitialLoad() {
            if (initialLoaded) return;
            let req = Math.min(2, imageUrls.length); let ready = 0;
            for (let i = 0; i < req; i++) if (imageLoadStatus[i] === 2 || imageLoadStatus[i] === -1) ready++;
            if (ready === req) {
                initialLoaded = true; document.getElementById('loading').style.display = 'none';
                toolbar.style.display = 'flex'; generateThumbnails(); resizeCanvas(); requestAnimationFrame(renderLoop);
            }
        }


// ---- 紙張紋理（僅產生一次，之後每幀重複使用，效能開銷極低）----
let paperTexturePattern = null;
function createPaperTexture() {
    const tex = document.createElement('canvas');
    const size = 128;
    tex.width = size; tex.height = size;
    const tctx = tex.getContext('2d');
    const imgData = tctx.createImageData(size, size);
    for (let i = 0; i < imgData.data.length; i += 4) {
        // 低對比灰階雜訊，讀起來像紙纖維而非數位噪點
        const v = 232 + Math.floor(Math.random() * 20 - 10);
        imgData.data[i] = v; imgData.data[i + 1] = v; imgData.data[i + 2] = v; imgData.data[i + 3] = 255;
    }
    tctx.putImageData(imgData, 0, 0);
    paperTexturePattern = ctx.createPattern(tex, 'repeat');
}
createPaperTexture();


        fetchImagesFromSheet();

        function constrainPoint(P, C) {
            let p = { x: P.x, y: P.y };
            let spineXPos = isSinglePageMode && C.x === 0 ? pageW : 0;
            let spineBase = { x: spineXPos, y: C.y };
            let dxSpine = p.x - spineBase.x, dySpine = p.y - spineBase.y, distSpine = Math.hypot(dxSpine, dySpine);
            if (distSpine > pageW) { p.x = spineBase.x + (dxSpine / distSpine) * pageW; p.y = spineBase.y + (dySpine / distSpine) * pageW; }
            let oppSpineBase = { x: spineXPos, y: (C.y === 0 ? pageH : 0) };
            let dxOpp = p.x - oppSpineBase.x, dyOpp = p.y - oppSpineBase.y, distOpp = Math.hypot(dxOpp, dyOpp), diagonal = Math.hypot(pageW, pageH);
            if (distOpp > diagonal) { p.x = oppSpineBase.x + (dxOpp / distOpp) * diagonal; p.y = oppSpineBase.y + (dyOpp / distOpp) * diagonal; }
            if (p.x < -pageW * 2) p.x = -pageW * 2; if (p.x > pageW * 2) p.x = pageW * 2;
            return p;
        }

        function clipPolygon(points, M, n) {
            let result = []; let dists = points.map(p => (p.x - M.x) * n.x + (p.y - M.y) * n.y);
            for (let i = 0; i < points.length; i++) {
                let p1 = points[i], p2 = points[(i + 1) % points.length];
                let d1 = dists[i], d2 = dists[(i + 1) % points.length];
                if (d1 >= 0) result.push(p1);
                if ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) {
                    let denom = d1 - d2;
                    let t = Math.abs(denom) > 1e-6 ? d1 / denom : 0;
                    result.push({ x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) });
                }
            }
            return result;
        }

        function tracePoly(ctx, pts) {
            if (!pts || pts.length === 0) { ctx.beginPath(); return; }
            ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();
        }

        function drawPageContent(ctx, idx) {
    if (idx < 0 || idx >= imageUrls.length) return; 

    // 紙張底色：偏暖米白取代純白，較貼近實體紙張色調
    ctx.fillStyle = '#fbfaf6'; 
    ctx.fillRect(0, 0, pageW, pageH);

    // 紙張紋理：低對比雜訊以 multiply 疊加，模擬紙纖維觸感
    if (paperTexturePattern) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = paperTexturePattern;
        ctx.fillRect(0, 0, pageW, pageH);
        ctx.restore();
    }

    // 環境光暈：模擬光源由上方灑落，頁面上緣略亮、下緣略暗，增加立體感
    let ambientLight = ctx.createLinearGradient(0, 0, 0, pageH);
    ambientLight.addColorStop(0, 'rgba(255,255,255,0.18)');
    ambientLight.addColorStop(0.4, 'rgba(255,255,255,0)');
    ambientLight.addColorStop(1, 'rgba(0,0,0,0.04)');
    ctx.fillStyle = ambientLight;
    ctx.fillRect(0, 0, pageW, pageH);
    
    if (imageLoadStatus[idx] === 2 && images[idx]) {
        const margin = pageW * 0.002;
        const availW = pageW - margin * 2; const availH = pageH - margin * 2;
        const imgAspect = images[idx].width / images[idx].height; const pageAspect = availW / availH;
        let drawW = imgAspect > pageAspect ? availW : availH * imgAspect;
        let drawH = imgAspect > pageAspect ? availW / imgAspect : availH;
        let offsetX = !isSinglePageMode ? (idx % 2 !== 0 ? -(pageW * 0.002) : (pageW * 0.002)) : 0;
        ctx.drawImage(images[idx], margin + (availW - drawW)/2 + offsetX, margin + (availH - drawH)/2, drawW, drawH);
    } else {
        ctx.fillStyle = '#f5f5f5'; ctx.fillRect(pageW * 0.1, pageH * 0.1, pageW * 0.8, pageH * 0.8);
        ctx.fillStyle = '#999'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(imageLoadStatus[idx] === -1 ? '圖片載入失敗' : '頁面載入中...', pageW / 2, pageH / 2);
    }
    
    ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 1; ctx.strokeRect(0, 0, pageW, pageH);
    if (!isSinglePageMode) {
        let spineShadow = ctx.createLinearGradient(idx % 2 !== 0 ? pageW - 35 : 0, 0, idx % 2 !== 0 ? pageW : 35, 0);
        spineShadow.addColorStop(0, idx % 2 !== 0 ? 'rgba(0,0,0,0)' : 'rgba(0,0,0,0.18)');
        spineShadow.addColorStop(1, idx % 2 !== 0 ? 'rgba(0,0,0,0.18)' : 'rgba(0,0,0,0)');
        ctx.fillStyle = spineShadow; ctx.fillRect(idx % 2 !== 0 ? pageW - 35 : 0, 0, 35, pageH);
    }
}
        function draw() {
            ctx.clearRect(0, 0, canvasW, canvasH);
            ctx.save(); ctx.translate(canvasW / 2 + panX, canvasH / 2 + panY); ctx.scale(currentZoom, currentZoom); ctx.translate(-canvasW / 2, -canvasH / 2);

            // 繪製背景大陰影
            ctx.save(); ctx.translate(paddingX, paddingY);
            ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 45; ctx.shadowOffsetY = 25; ctx.fillRect(0, 0, bookW, bookH);
            ctx.restore();

            // 繪製紙張厚度
            ctx.save(); ctx.translate(spineX, paddingY);
            
            let leftTableSpreads = currentSpread;
            let rightTableSpreads = maxIndex - currentSpread;
            
            // 動態修正：翻頁動畫進行中時，被掀起的那一頁不應算在底層靜態厚度內
            if (flip.active || flip.hovering || flip.isRetracting) {
                if (flip.dir === -1) leftTableSpreads = Math.max(0, leftTableSpreads - 1);

            flip.dir = dir; flip.cornerBase = { x: startX, y: pageH }; flip.p = { x: startX, y: pageH }; flip.v = { x: 0, y: 0 }; setFlipTarget(dir, true);
        }
        
        nextBtn.addEventListener('click', () => triggerButtonFlip(1)); prevBtn.addEventListener('click', () => triggerButtonFlip(-1));
        pageSlider.addEventListener('input', (e) => {
            let targetSpread = Math.min(Math.max(0, isSinglePageMode ? parseInt(e.target.value, 10) - 1 : Math.floor(parseInt(e.target.value, 10) / 2)), maxIndex);
            if (targetSpread !== currentSpread) { currentSpread = targetSpread; updateUI(); if (initialLoaded) draw(); }
        });
        const thumbObserver = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting && imageLoadStatus[parseInt(entry.target.dataset.index, 10)] === 0) loadImage(parseInt(entry.target.dataset.index, 10)); }); }, { root: document.getElementById('thumb-bar'), rootMargin: '100px' });
        function generateThumbnails() {
            thumbBar.innerHTML = '';
            imageUrls.forEach((url, index) => {
                const item = document.createElement('div'); item.className = 'thumb-item'; item.id = `thumb-${index}`; item.dataset.index = index;
                item.innerHTML = `<div class="thumb-img-container" id="thumb-img-box-${index}"><i class="fas fa-spinner fa-spin"></i></div><div class="thumb-page-num">${index + 1}</div>`;
                item.addEventListener('click', () => { currentSpread = Math.min(Math.max(0, isSinglePageMode ? index : Math.floor((index + 1) / 2)), maxIndex); updateUI(); if (initialLoaded) draw(); });
                thumbBar.appendChild(item); thumbObserver.observe(item);
                if (imageLoadStatus[index] === 2 || imageLoadStatus[index] === -1) updateThumbnail(index);
            });
        }
        function updateThumbnail(idx) {
            const box = document.getElementById(`thumb-img-box-${idx}`);
            if (box) {
                if (imageLoadStatus[idx] === 2 && images[idx]) box.innerHTML = `<img src="${images[idx].src}" class="thumb-img" alt="P.${idx+1}">`;
                else if (imageLoadStatus[idx] === -1) box.innerHTML = `<div class="thumb-error"><i class="fas fa-exclamation-triangle"></i></div>`;
            }
        }
        document.getElementById('btn-grid').addEventListener('click', function(e) { e.stopPropagation(); thumbBar.classList.toggle('active'); this.classList.toggle('active'); document.getElementById('share-popup').classList.remove('active'); if (thumbBar.classList.contains('active')) updateUI(); });
        const shareBtn = document.getElementById('btn-share'); const sharePopup = document.getElementById('share-popup'); const shareUrlInput = document.getElementById('share-url-input'); const qrImg = document.getElementById('qr-img');
        shareBtn.addEventListener('click', (e) => { e.stopPropagation(); sharePopup.classList.toggle('active'); thumbBar.classList.remove('active'); document.getElementById('btn-grid').classList.remove('active'); if (sharePopup.classList.contains('active')) { const url = window.location.href; shareUrlInput.value = url; qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}&margin=0`; }});
        const getUrl = () => encodeURIComponent(window.location.href); const getTitle = () => encodeURIComponent(document.title);
        document.getElementById('share-fb').addEventListener('click', () => window.open(`https://www.facebook.com/sharer/sharer.php?u=${getUrl()}`, '_blank', 'width=600,height=400')); document.getElementById('share-x').addEventListener('click', () => window.open(`https://twitter.com/intent/tweet?url=${getUrl()}&text=${getTitle()}`, '_blank', 'width=600,height=400')); document.getElementById('share-line').addEventListener('click', () => window.open(`https://social-plugins.line.me/lineit/share?url=${getUrl()}`, '_blank', 'width=600,height=500')); document.getElementById('share-in').addEventListener('click', () => window.open(`https://www.linkedin.com/shareArticle?mini=true&url=${getUrl()}&title=${getTitle()}`, '_blank', 'width=600,height=500')); document.getElementById('share-pin').addEventListener('click', () => { let img = imageUrls.length > 0 ? encodeURIComponent(imageUrls[0]) : ''; window.open(`https://pinterest.com/pin/create/button/?url=${getUrl()}&media=${img}&description=${getTitle()}`, '_blank', 'width=600,height=500'); }); document.getElementById('share-email').addEventListener('click', () => window.location.href = `mailto:?subject=${getTitle()}&body=來看看這本翻頁書：${window.location.href}`); document.getElementById('share-more').addEventListener('click', () => { if (navigator.share) navigator.share({ title: document.title, text: '來看看這本線上翻頁書！', url: window.location.href }).catch(() => {}); else alert("您的瀏覽器不支援系統分享選單，可直接點擊下方網址複製。"); });
        shareUrlInput.addEventListener('click', async function() { this.select(); let copied = false; if (navigator.clipboard && navigator.clipboard.writeText) { try { await navigator.clipboard.writeText(window.location.href); copied = true; } catch(e) {} } if (!copied) { document.execCommand("copy"); } let originalBg = this.style.backgroundColor; this.style.backgroundColor = "#e8f0fe"; setTimeout(() => { this.style.backgroundColor = originalBg; alert("網址已成功複製到剪貼簿！"); }, 100); });
        sharePopup.addEventListener('click', (e) => e.stopPropagation()); document.addEventListener('click', () => sharePopup.classList.remove('active'));
        document.getElementById('btn-zoom-in').addEventListener('click', () => { currentZoom = Math.min(3, currentZoom + 0.25); if (initialLoaded) draw(); }); document.getElementById('btn-zoom-out').addEventListener('click', () => { currentZoom = Math.max(0.8, currentZoom - 0.25); if (currentZoom <= 1.02) { panX = 0; panY = 0; currentZoom = 1; } if (initialLoaded) draw(); }); document.getElementById('btn-fullscreen').addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); });
        pageDisplay.addEventListener('click', () => { let p = prompt(`輸入欲跳轉的頁數 (1 - ${imageUrls.length}):`); if (p && !isNaN(parseInt(p, 10))) { let val = parseInt(p, 10); if (val >= 1 && val <= imageUrls.length) { pageSlider.value = val; pageSlider.dispatchEvent(new Event('input')); } } });
// 新增：跳到首頁事件
document.getElementById('btn-first').addEventListener('click', () => {
    if (currentSpread !== 0) {
        currentSpread = 0;
        updateUI();
        if (initialLoaded) draw();
    }
});

// 新增：跳到末頁事件
document.getElementById('btn-last').addEventListener('click', () => {
    if (currentSpread !== maxIndex) {
        currentSpread = maxIndex;
        updateUI();
        if (initialLoaded) draw();
    }
});    

</script>
</body>
</html>
